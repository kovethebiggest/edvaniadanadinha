
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDVANIA + ANDRESSA SAFADINHAS SITE</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  background: linear-gradient(90deg, #ff1493, #800080);
  padding: 35px 15px;
}

h1 { font-size: 28px; }
h2 { color: #ff69b4; }

.galeria {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

.galeria img {
  width: 100%;
  border-radius: 15px;
  box-shadow: 0 0 15px #ff1493;
}

.chat {
  background: #222;
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 15px;
}

input {
  padding: 12px;
  border-radius: 8px;
  border: none;
  width: 65%;
  max-width: 90%;
}

button {
  background: #ff1493;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

.mensagem {
  background: #333;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: left;
  overflow-wrap: anywhere;
}

#mensagens {
  max-height: 450px;
  overflow-y: auto;
}

#status {
  font-size: 13px;
  color: #ffb6d9;
}
</style>
</head>
<body>

<header>
  <h1>EDVANIA + ANDRESSA SAFADINHAS SITE 💗</h1>
  <p>Bem-vindos ao nosso site!</p>
</header>

<h2>📸 Nossas fotinhas</h2>

<div class="galeria">
  <img src="fotos/foto1.png.webp" alt="Primeira foto">
  <img src="fotos/foto2.png.webp" alt="Segunda foto">
</div>

<div class="chat">
  <h2>💬 Chat Público</h2>
  <p>Deixe seu comentário!</p>

  <p id="status">Conectando...</p>

  <div id="mensagens"></div>

  <form id="formulario">
    <input
      id="texto"
      maxlength="300"
      placeholder="Digite sua mensagem..."
      required
    >
    <button id="botao" type="submit">
      Enviar 💗
    </button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXuacLRim4NCOvyGeoZQTA5zuc7WBbfLw",
  authDomain: "edvania-chat.firebaseapp.com",
  projectId: "edvania-chat",
  storageBucket: "edvania-chat.firebasestorage.app",
  messagingSenderId: "496021373346",
  appId: "1:496021373346:web:0808e4a00d20557738b2fb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const mensagensRef = collection(db, "mensagens");

const lista = document.getElementById("mensagens");
const campo = document.getElementById("texto");
const botao = document.getElementById("botao");
const status = document.getElementById("status");
const formulario = document.getElementById("formulario");

const consulta = query(
  mensagensRef,
  orderBy("criadoEm", "desc"),
  limit(50)
);

onSnapshot(consulta, (snapshot) => {
  lista.replaceChildren();

  snapshot.docs.reverse().forEach((documento) => {
    const dados = documento.data();
    const mensagem = document.createElement("div");

    mensagem.className = "mensagem";
    mensagem.textContent = "👤 Anônimo: " + dados.texto;

    lista.appendChild(mensagem);
  });

  status.textContent = "🟢 Chat conectado";
  lista.scrollTop = lista.scrollHeight;
}, (erro) => {
  status.textContent = "❌ Erro ao carregar mensagens";
  console.error(erro);
});

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();

  const texto = campo.value.trim();

  if (!texto || botao.disabled) return;

  botao.disabled = true;

  try {
    await addDoc(mensagensRef, {
      texto: texto,
      criadoEm: serverTimestamp()
    });

    campo.value = "";
    status.textContent = "🟢 Mensagem enviada!";
  } catch (erro) {
    status.textContent = "❌ Erro ao enviar mensagem";
    console.error(erro);
  } finally {
    botao.disabled = false;
  }
});
</script>

</body>
</html>
